<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测测你的本命柱</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #fffaf5;
      --text: #5b5650;
      --muted: #9a9188;
      --primary: #c9b8a3;
      --primary-dark: #a98f76;
      --accent: #d8c7b8;
      --soft: #efe6dc;
      --white: #ffffff;
      --shadow: 0 8px 24px rgba(120, 100, 80, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 16px 28px;
      background: var(--bg);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 243, 238, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px 4px 10px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      border-bottom: 1px solid rgba(0,0,0,0.03);
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
      margin-top: 16px;
    }

    .hero {
      text-align: center;
      padding-top: 28px;
      padding-bottom: 28px;
    }

    .badge {
      display: inline-block;
      background: var(--soft);
      color: var(--primary-dark);
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 10px;
      color: #4f4942;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin: 0 auto 20px;
      max-width: 320px;
    }

    .desc {
      font-size: 14px;
      color: #7b736a;
      background: #fff;
      border: 1px solid #f0e7dd;
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      margin-bottom: 22px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 16px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(169, 143, 118, 0.18);
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.secondary {
      background: #fff;
      color: var(--primary-dark);
      border: 1px solid #e7dccd;
      box-shadow: none;
      margin-top: 10px;
    }

    .progress-wrap {
      margin: 8px 0 18px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress {
      height: 8px;
      background: #eee4d9;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d8c7b8, #c9b8a3);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .question-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 18px;
      color: #4f4942;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid #eee2d5;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      font-size: 15px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .option:hover {
      border-color: #d8c7b8;
      background: #fffaf6;
    }

    .option.selected {
      border-color: var(--primary-dark);
      background: #f7efe7;
    }

    .result-tag {
      display: inline-block;
      background: var(--soft);
      color: var(--primary-dark);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .result-name {
      font-size: 26px;
      margin: 0 0 8px;
      color: #4f4942;
    }

    .keywords {
      font-size: 14px;
      color: var(--primary-dark);
      margin-bottom: 18px;
    }

    .section {
      background: #fff;
      border: 1px solid #f0e7dd;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
    }

    .section h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #6d6258;
    }

    .section p {
      margin: 0;
      font-size: 14px;
      color: #7b736a;
    }

    .share-line {
      background: #f8f1ea;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      color: #6f5f50;
      font-size: 15px;
      margin: 16px 0 18px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #b0a79d;
      margin-top: 18px;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 481px) {
      body {
        background: #f1ece6;
      }
      .page {
        box-shadow: 0 0 0 1px rgba(0,0,0,0.02);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">测测你的本命柱｜你最适合在鬼灭世界里成为谁？</div>

    <!-- 封面页 -->

      </div>

      <button class="btn" onclick="startQuiz()">开始测试</button>
      <div class="footer-note">适合截图分享 · 小红书清新简约风</div>
    </section>

        </div>

        </div>
      </div>

      <h2 id="questionTitle" class="question-title"></h2>
      <div id="optionsBox"></div>
    </section>

    <!-- 结果页 -->
    <section id="result" class="card hidden">
      <div style="text-align:center;">

      </div>

      </div>

      <div class="section">

      <div id="shareLine" class="share-line"></div>

      <button class="btn" onclick="restartQuiz()">重新测试</button>
      <button class="btn secondary" onclick="copyResult()">复制我的结果</button>

      <div class="footer-note">结果仅供娱乐与分享</div>
    </section>
  </div>

    let currentQuestion = 0;
    let totalScores = {};

    function initScores() {
      totalScores = {
        water: 0,
        flame: 0,
        insect: 0,
        mist: 0,
        love: 0,
        wind: 0,
        sound: 0,
        snake: 0

    }

    function showPage(id) {
      document.getElementById("cover").classList.add("hidden");
      document.getElementById("quiz").classList.add("hidden");
      document.getElementById("result").classList.add("hidden");
      document.getElementById(id).classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startQuiz() {
      initScores();
      currentQuestion = 0;
      showPage("quiz");
      renderQuestion();
    }

    function restartQuiz() {
      startQuiz();
    }

    function renderQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("questionTitle").textContent = q.title;

      const percent = Math.round(((currentQuestion + 1) / questions.length) * 100);
      document.getElementById("progressLabel").textContent = `第 ${currentQuestion + 1}/${questions.length} 题`;
      document.getElementById("progressPercent").textContent = `${percent}%`;
      document.getElementById("progressBar").style.width = `${percent}%`;

      const box = document.getElementById("optionsBox");
      box.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = opt.text;
        btn.onclick = () => selectOption(index, btn);
        box.appendChild(btn);
      });
    }

    function selectOption(index, btn) {
      const options = document.querySelectorAll(".option");
      options.forEach(o => o.classList.remove("selected"));
      btn.classList.add("selected");

      const selectedScores = questions[currentQuestion].options[index].scores;
      for (let key in selectedScores) {
        totalScores[key] += selectedScores[key];
      }

      setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showResult();
        }
      }, 220);
    }

    function getTopResult() {
      let topKey = "water";
      let topValue = -1;
      for (let key in totalScores) {
        if (totalScores[key] > topValue) {
          topValue = totalScores[key];
          topKey = key;
        }
      }
      return topKey;
    }

    function showResult() {
      const key = getTopResult();
      const r = results[key];

      document.getElementById("resultName").textContent = r.name;
      document.getElementById("resultKeywords").textContent = r.keywords;
      document.getElementById("resultDesc").textContent = r.desc;
      document.getElementById("resultStrength").textContent = r.strength;
      document.getElementById("resultWeakness").textContent = r.weakness;
      document.getElementById("resultPartner").textContent = r.partner;
      document.getElementById("shareLine").textContent = `“${r.share}”`;

      showPage("result");
    }

    function copyResult() {
      const text = `
测测你的本命柱｜我的结果是：${document.getElementById("resultName").textContent}
关键词：${document.getElementById("resultKeywords").textContent}

${document.getElementById("resultDesc").textContent}

优势：${document.getElementById("resultStrength").textContent}
小缺点：${document.getElementById("resultWeakness").textContent}
适合并肩作战的人：${document.getElementById("resultPartner").textContent}

${document.getElementById("shareLine").textContent}
      `.trim();

      navigator.clipboard.writeText(text).then(() => {
        alert("结果已复制，快去分享吧！");
      }).catch(() => {
        alert("复制失败，请手动截图分享。");
      });
    }
  </script>
</body>
